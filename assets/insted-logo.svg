      <stop offset="0" stop-color="#0b8adb"/>
      <stop offset="1" stop-color="#08529e"/>
    </linearGradient>
  </defs>

  <!-- marca: escudo aberto com livro -->
  <g transform="translate(6 6)">
    <path d="M36 4 6 13v19c0 16 12 26 30 30 18-4 30-14 30-30V13L36 4z" fill="url(#imBlue)"/>
    <path d="M36 12 15 18v14c0 11 8 19 21 22 13-3 21-11 21-22V18L36 12z" fill="#fff" opacity=".92"/>
