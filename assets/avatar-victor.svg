<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="Foto do estudante">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeeff"/>
      <stop offset="1" stop-color="#bcd9f5"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25405e"/>
      <stop offset="1" stop-color="#16283f"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d3b6"/>
      <stop offset="1" stop-color="#e8b795"/>
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#bg)"/>

  <!-- ombros / blazer -->
  <path d="M150 300c-58 0-98 26-108 62-4 14-6 26-6 38h228c0-12-2-24-6-38-10-36-50-62-108-62z" fill="url(#jacket)"/>
  <!-- camisa branca -->
  <path d="M150 300l-30 10 30 44 30-44-30-10z" fill="#f4f8fc"/>
  <!-- colarinho esquerdo/direito -->
  <path d="M150 300l-30 10 12 16 18-26z" fill="#e8eef5"/>
  <path d="M150 300l30 10-12 16-18-26z" fill="#e8eef5"/>
  <!-- gravata -->
  <path d="M150 322l-9 8 7 62h4l7-62-9-8z" fill="#0b6bcb"/>
  <path d="M150 322l-14 6 14 14 14-14-14-6z" fill="#0a5cb2"/>

  <!-- pescoco -->
  <path d="M132 262h36v42c0 8-8 14-18 14s-18-6-18-14v-42z" fill="#e5b491"/>

  <!-- cabeca -->
  <ellipse cx="150" cy="196" rx="58" ry="70" fill="url(#skin)"/>
  <!-- orelhas -->
  <ellipse cx="93" cy="200" rx="9" ry="14" fill="#e8b795"/>
  <ellipse cx="207" cy="200" rx="9" ry="14" fill="#e8b795"/>

  <!-- cabelo -->
  <path d="M150 122c-36 0-60 22-62 56-1 14 2 26 6 34 2-16 4-28 10-36 12 8 30 12 46 12s34-4 46-12c6 8 8 20 10 36 4-8 7-20 6-34-2-34-26-56-62-56z" fill="#2c2119"/>
  <path d="M150 122c-30 0-52 16-59 42 14-16 36-24 59-24s45 8 59 24c-7-26-29-42-59-42z" fill="#3c2e22"/>

  <!-- sobrancelhas -->
  <path d="M118 186c6-5 16-6 22-2" stroke="#2c2119" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M160 184c6-4 16-3 22 2" stroke="#2c2119" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- olhos -->
  <ellipse cx="130" cy="200" rx="7" ry="8" fill="#2c2119"/>
  <ellipse cx="170" cy="200" rx="7" ry="8" fill="#2c2119"/>
  <circle cx="132" cy="197" r="2" fill="#fff"/>
  <circle cx="172" cy="197" r="2" fill="#fff"/>
  <!-- nariz -->
  <path d="M150 206v14c0 3-2 4-4 5" stroke="#d9a07e" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- boca / sorriso -->
  <path d="M132 238c10 10 26 10 36 0" stroke="#b4695a" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
